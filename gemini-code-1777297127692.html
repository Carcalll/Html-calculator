<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whiteboard - Smooth Highlighter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #4a4a4a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      user-select: none;
    }

    /* ── Toolbar ── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #2a2a2a;
      border-radius: 12px 12px 0 0;
      padding: 10px 16px;
      width: 900px;
      box-shadow: 0 -2px 12px rgba(0,0,0,.4);
    }

    .tool-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #3a3a3a;
      border: 1.5px solid #555;
      border-radius: 8px;
      color: #ccc;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 13px;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      letter-spacing: .3px;
    }
    .tool-btn svg { flex-shrink: 0; }
    .tool-btn:hover { background: #4a4a4a; color: #fff; }
    .tool-btn.active { background: #1a1a1a; border-color: #fff; color: #fff; }

    /* ── Colour circle ── */
    #colorBtn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2.5px solid #888;
      padding: 0;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: border-color .15s, transform .15s;
      background: none;
    }
    #colorBtn:hover { border-color: #fff; transform: scale(1.1); }
    #colorPreview { position: absolute; inset: 0; border-radius: 50%; }

    /* ── Colour popup ── */
    #colorPopup {
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      border: 1.5px solid #555;
      border-radius: 10px;
      padding: 10px;
      z-index: 200;
      width: 196px;
      box-shadow: 0 6px 24px rgba(0,0,0,.6);
      display: none;
    }
    #colorPopup.open { display: block; }

    .cp-tabs { display: flex; gap: 4px; margin-bottom: 10px; }
    .cp-tab {
      flex: 1;
      background: #333;
      border: 1.5px solid #555;
      border-radius: 6px;
      color: #aaa;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 0;
      cursor: pointer;
      text-align: center;
      transition: background .12s, color .12s, border-color .12s;
      letter-spacing: .3px;
    }
    .cp-tab:hover { color: #fff; }
    .cp-tab.active { background: #111; border-color: #fff; color: #fff; }

    #tabCustom { display: flex; flex-direction: column; align-items: center; }
    #nativeColorPicker {
      width: 100%;
      height: 38px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      padding: 0;
      background: none;
    }

    #tabPresets { display: none; }
    #tabPresets.show { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .preset-swatch {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 6px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform .12s, border-color .12s;
    }
    .preset-swatch:hover { transform: scale(1.1); }
    .preset-swatch.selected { border-color: #fff; }

    /* size slider */
    .slider-wrap { display: flex; align-items: center; gap: 8px; margin-left: 4px; }
    .slider-wrap label { color: #999; font-size: 12px; }
    input[type="range"] {
      -webkit-appearance: none;
      width: 90px; height: 4px;
      background: #555; border-radius: 2px; outline: none; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%; background: #fff; cursor: pointer;
    }

    .sep { width: 1px; height: 28px; background: #555; margin: 0 4px; }
    .spacer { flex: 1; }

    /* ── Canvas area ── */
    #canvasWrap {
      position: relative;
      width: 900px;
      height: 540px;
      border-radius: 0 0 4px 4px;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      overflow: hidden;
    }

    /* Maths-copy grid — minor lines every 20px, major every 100px */
    #gridBg {
      position: absolute;
      inset: 0;
      background-color: #f5f5f0;
      background-image:
        linear-gradient(to right,  rgba(150,185,230,.5) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(150,185,230,.5) 1px, transparent 1px),
        linear-gradient(to right,  rgba(100,145,210,.7) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(100,145,210,.7) 1px, transparent 1px);
      background-size: 20px 20px, 20px 20px, 100px 100px, 100px 100px;
    }

    #canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 900px;
      height: 540px;
      cursor: crosshair;
      background: transparent;
    }

    /* Line hint */
    #lineHint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.75);
      color: #fff;
      padding: 6px 16px;
      border-radius: 8px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s;
    }
    #lineHint.show { opacity: 1; }
  </style>
</head>
<body>

<div id="toolbar">
  <button class="tool-btn active" id="btnPen" title="Pen">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>
    </svg>
    Pen
  </button>

  <button class="tool-btn" id="btnHighlight" title="Highlighter">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m9 11-6 6v3h3l6-6"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4Z"/>
    </svg>
    Highlighter
  </button>

  <button class="tool-btn" id="btnLine" title="Line (click two points)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="21" x2="21" y2="3"/>
    </svg>
    Line
  </button>

  <div class="sep"></div>

  <div style="position:relative; flex-shrink:0;">
    <button id="colorBtn" title="Pick colour">
      <div id="colorPreview" style="background:#111111;"></div>
    </button>

    <div id="colorPopup">
      <div class="cp-tabs">
        <button class="cp-tab active" id="tabBtnCustom">Custom</button>
        <button class="cp-tab"        id="tabBtnPresets">Presets</button>
      </div>
      <div id="tabCustom">
        <input type="color" id="nativeColorPicker" value="#111111" />
      </div>
      <div id="tabPresets"></div>
    </div>
  </div>

  <div class="slider-wrap">
    <label>Size</label>
    <input type="range" id="sizeSlider" min="1" max="40" value="4" />
  </div>

  <div class="spacer"></div>

  <button class="tool-btn" id="btnUndo" title="Undo (Ctrl+Z)">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/>
    </svg>
    Undo
  </button>

  <button class="tool-btn" id="btnClear" title="Clear canvas">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
    </svg>
    Clear
  </button>
</div>

<div id="canvasWrap">
  <div id="gridBg"></div>
  <canvas id="canvas" width="900" height="540"></canvas>
</div>

<div id="lineHint">Click to set start — click again to draw line</div>

<script>
  const canvas    = document.getElementById('canvas');
  const ctx       = canvas.getContext('2d');
  const colorPreview      = document.getElementById('colorPreview');
  const nativeColorPicker = document.getElementById('nativeColorPicker');
  const sizeSlider        = document.getElementById('sizeSlider');
  const lineHint          = document.getElementById('lineHint');
  const colorPopup        = document.getElementById('colorPopup');
  const colorBtn          = document.getElementById('colorBtn');

  let tool     = 'pen';
  let painting = false;
  let color    = '#111111';
  let size     = 4;

  // Line state
  let linePhase = 0;
  let lineStart = null;
  let snapshot  = null;

  // Undo
  const undoStack = [];
  const MAX_UNDO  = 40;
  function saveUndo() {
    undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    if (undoStack.length > MAX_UNDO) undoStack.shift();
  }

  // ── Colour popup toggle ──
  let popupOpen = false;
  colorBtn.addEventListener('click', e => {
    e.stopPropagation();
    popupOpen = !popupOpen;
    colorPopup.classList.toggle('open', popupOpen);
  });
  document.addEventListener('click', e => {
    if (popupOpen && !colorPopup.contains(e.target) && e.target !== colorBtn) {
      popupOpen = false;
      colorPopup.classList.remove('open');
    }
  });

  // ── Tabs ──
  const tabBtnCustom  = document.getElementById('tabBtnCustom');
  const tabBtnPresets = document.getElementById('tabBtnPresets');
  const tabCustomDiv  = document.getElementById('tabCustom');
  const tabPresetsDiv = document.getElementById('tabPresets');

  tabBtnCustom.addEventListener('click', () => {
    tabBtnCustom.classList.add('active');
    tabBtnPresets.classList.remove('active');
    tabCustomDiv.style.display = 'flex';
    tabPresetsDiv.classList.remove('show');
  });
  tabBtnPresets.addEventListener('click', () => {
    tabBtnPresets.classList.add('active');
    tabBtnCustom.classList.remove('active');
    tabCustomDiv.style.display = 'none';
    tabPresetsDiv.classList.add('show');
  });

  // Custom picker
  nativeColorPicker.addEventListener('input', e => setColor(e.target.value));

  // Preset swatches
  const PRESETS = [
    { name: 'Black',  hex: '#111111' },
    { name: 'White',  hex: '#ffffff' },
    { name: 'Yellow', hex: '#f5c800' },
    { name: 'Red',    hex: '#e02020' },
    { name: 'Blue',   hex: '#1565d8' },
    { name: 'Green',  hex: '#1a9e3f' },
  ];

  PRESETS.forEach(p => {
    const sw = document.createElement('button');
    sw.className = 'preset-swatch';
    sw.style.background = p.hex;
    // white swatch gets a subtle border so it's visible against popup bg
    if (p.hex === '#ffffff') sw.style.border = '2px solid #666';
    sw.title = p.name;
    if (p.hex === '#111111') sw.classList.add('selected');
    sw.addEventListener('click', e => {
      e.stopPropagation();
      document.querySelectorAll('.preset-swatch').forEach(s => s.classList.remove('selected'));
      sw.classList.add('selected');
      setColor(p.hex);
    });
    tabPresetsDiv.appendChild(sw);
  });

  function setColor(hex) {
    color = hex;
    colorPreview.style.background = hex;
    nativeColorPicker.value = hex;
  }

  // ── Tools ──
  function setTool(t) {
    tool = t;
    ['btnPen','btnHighlight','btnLine'].forEach(id =>
      document.getElementById(id).classList.remove('active')
    );
    const map = { pen:'btnPen', highlight:'btnHighlight', line:'btnLine' };
    document.getElementById(map[t]).classList.add('active');

    if (t !== 'line') {
      linePhase = 0; lineStart = null;
      lineHint.classList.remove('show');
    } else {
      lineHint.classList.add('show');
    }
  }

  document.getElementById('btnPen').addEventListener('click',       () => setTool('pen'));
  document.getElementById('btnHighlight').addEventListener('click', () => setTool('highlight'));
  document.getElementById('btnLine').addEventListener('click',      () => setTool('line'));

  sizeSlider.addEventListener('input', e => { size = +e.target.value; });

  document.getElementById('btnUndo').addEventListener('click', undo);
  document.addEventListener('keydown', e => { if ((e.ctrlKey||e.metaKey) && e.key==='z') undo(); });
  function undo() {
    if (!undoStack.length) return;
    ctx.putImageData(undoStack.pop(), 0, 0);
  }

  document.getElementById('btnClear').addEventListener('click', () => {
    saveUndo();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });

  // ── Position helper ──
  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    if (e.touches) return { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top };
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function applyToolStyle() {
    if (tool === 'highlight') {
      // Lowered opacity and changed to 'source-over' to slow down darkening speed
      ctx.globalAlpha = 0.1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.lineWidth = size * 4;
    } else {
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.lineWidth = size;
    }
    ctx.strokeStyle = color;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }

  // ── Freehand ──
  function startDraw(e) {
    if (tool === 'line') return;
    e.preventDefault();
    saveUndo();
    painting = true;
    const { x, y } = getPos(e);
    applyToolStyle();
    ctx.beginPath();
    ctx.moveTo(x, y);
  }
  function draw(e) {
    if (!painting || tool === 'line') return;
    e.preventDefault();
    const { x, y } = getPos(e);
    ctx.lineTo(x, y);
    ctx.stroke();
  }
  function endDraw() {
    if (!painting) return;
    painting = false;
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup',   endDraw);
  canvas.addEventListener('mouseleave',endDraw);
  canvas.addEventListener('touchstart', startDraw, { passive:false });
  canvas.addEventListener('touchmove',  draw,       { passive:false });
  canvas.addEventListener('touchend',   endDraw);

  // ── Line tool ──
  canvas.addEventListener('click',     lineClick);
  canvas.addEventListener('mousemove', linePreview);

  function lineClick(e) {
    if (tool !== 'line') return;
    const pos = getPos(e);
    if (linePhase === 0) {
      lineStart = pos;
      snapshot  = ctx.getImageData(0, 0, canvas.width, canvas.height);
      linePhase = 1;
      lineHint.classList.remove('show');
    } else {
      saveUndo();
      ctx.putImageData(snapshot, 0, 0);
      drawStraightLine(lineStart, pos);
      linePhase = 0; lineStart = null; snapshot = null;
      lineHint.textContent = 'Click to set start — click again to draw line';
      lineHint.classList.add('show');
    }
  }

  function linePreview(e) {
    if (tool !== 'line' || linePhase !== 1 || !snapshot) return;
    const pos = getPos(e);
    ctx.putImageData(snapshot, 0, 0);
    ctx.setLineDash([6, 4]);
    drawStraightLine(lineStart, pos, true);
    ctx.setLineDash([]);
  }

  function drawStraightLine(a, b, preview = false) {
    ctx.globalAlpha = preview ? 0.5 : 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = color;
    ctx.lineWidth   = size;
    ctx.lineCap     = 'round';
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
</script>
</body>
</html>
